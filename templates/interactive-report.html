<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juno Returns Utilization</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f4f7f4;color:#1a2e1a;font-size:15px}
.header{background:#013A2F;color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.25em;font-weight:500;letter-spacing:.02em}
.header .sub{font-size:.78em;opacity:.7;margin-top:3px}
.container{padding:24px 32px}
#pmeta{font-size:.82em;color:#666;margin-bottom:16px}
.warn-banner{background:#fef3cd;border:1px solid #ffc107;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:.83em;color:#856404}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px}
.sb{background:#fff;border-radius:10px;padding:14px 20px;border:1px solid #e2e8e2;min-width:90px}
.sb .v{font-size:1.9em;font-weight:500;color:#013A2F}
.sb .l{color:#999;font-size:.74em;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:#fff;border:1px solid #d1d5db;border-radius:20px;padding:5px 14px;font-size:.78em;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s}
.fbtn:hover{border-color:#013A2F;color:#013A2F}
.fbtn.active{background:#013A2F;color:#fff;border-color:#013A2F}
.search-wrap{margin-left:auto}
#search{border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;font-family:'Outfit',sans-serif;font-size:.84em;width:220px;outline:none}
#search:focus{border-color:#013A2F}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8e2;margin-bottom:28px;font-size:.86em}
th{background:#013A2F;color:#fff;padding:9px 12px;text-align:left;font-weight:400;font-size:.77em;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:#024a3c}
.si{display:inline-block;margin-left:5px;opacity:.6;font-size:.9em}
td{padding:7px 12px;border-bottom:1px solid #f0f4f0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f0fbf6!important}
.CR td{background:#fef2f2}.WA td{background:#fffbeb}.WC td{background:#fefce8}
.up{color:#059669;font-weight:500}.dn{color:#dc2626;font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75em;font-weight:500}
.badge.CRITICAL{background:#fee2e2;color:#991b1b}
.badge.WARNING{background:#fef3c7;color:#92400e}
.badge.WATCH{background:#fefce8;color:#713f12}
.badge.OK{background:#dcfce7;color:#166534}
.drill-btn{background:none;border:1px solid #d1d5db;border-radius:6px;padding:3px 10px;font-size:.76em;cursor:pointer;color:#013A2F;font-family:'Outfit',sans-serif}
.drill-btn:hover{background:#013A2F;color:#fff;border-color:#013A2F}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:480px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:1.1em;font-weight:600;color:#013A2F;margin-bottom:16px;border-bottom:1px solid #e2e8e2;padding-bottom:10px}
.modal .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:.9em}
.modal .row:last-child{border-bottom:none}
.modal .k{color:#666}.modal .v{font-weight:500}
.close-btn{background:#013A2F;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:18px;font-size:.9em}
.close-btn:hover{background:#024a3c}
.csm-tag{background:#e8f4f1;color:#013A2F;border-radius:6px;padding:1px 7px;font-size:.8em;font-weight:500}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header h1">Returns Utilization</div>
    <div class="sub">Juno Customer Success · Daily Report</div>
  </div>
  <div style="text-align:right;font-size:.8em;opacity:.8" id="pmeta"></div>
</div>
<div class="container">
  <div id="warnArea"></div>
  <div class="stats" id="statsBox"></div>
  <div class="controls">
    <div class="filters" id="filters">
      <button class="fbtn active" onclick="setFilter('ALL')">All</button>
      <button class="fbtn" onclick="setFilter('CRITICAL')">🔴 Critical</button>
      <button class="fbtn" onclick="setFilter('WARNING')">🟡 Warning</button>
      <button class="fbtn" onclick="setFilter('WATCH')">🟠 Watch</button>
      <button class="fbtn" onclick="setFilter('OK')">🟢 OK</button>
    </div>
    <div class="search-wrap"><input id="search" type="text" placeholder="Search org or CSM…" oninput="renderTable()"></div>
  </div>
  <table id="mtbl">
  <thead><tr>
    <th onclick="sortArr('n')" data-k="n">Org <span class="si">↕</span></th>
    <th onclick="sortArr('csm')" data-k="csm">CSM <span class="si">↕</span></th>
    <th onclick="sortArr('st')" data-k="st">Status <span class="si">↕</span></th>
    <th onclick="sortArr('up')" data-k="up">Util% <span class="si">↕</span></th>
    <th onclick="sortArr('p')" data-k="p">Purchased <span class="si">↕</span></th>
    <th onclick="sortArr('u')" data-k="u">Used <span class="si">↕</span></th>
    <th onclick="sortArr('du')" data-k="du">ΔUsed <span class="si">↕</span></th>
    <th onclick="sortArr('dutil')" data-k="dutil">ΔUtil% <span class="si">↕</span></th>
    <th>Detail</th>
  </tr></thead>
  <tbody id="abdy"></tbody>
  </table>
  <div style="font-size:.78em;color:#aaa;text-align:center;margin-top:-18px" id="rowCount"></div>
</div>
<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="mTitle">Org Detail</h2>
    <div id="mBody"></div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>
<script>
const _raw=__DATA_PLACEHOLDER__;
const _meta=__META_PLACEHOLDER__;
const _warn=__WARN_PLACEHOLDER__;
const stOrder={CRITICAL:0,WARNING:1,WATCH:2,OK:3};
let _data=[..._raw];
let _sortKey='up';
let _sortDir=-1;
let _filter='ALL';

// Stats
const stats={total:_data.length,crit:_data.filter(o=>o.st==='CRITICAL').length,warn:_data.filter(o=>o.st==='WARNING').length,watch:_data.filter(o=>o.st==='WATCH').length,ok:_data.filter(o=>o.st==='OK').length,tpu:_data.reduce((s,o)=>s+o.p,0),tuu:_data.reduce((s,o)=>s+o.u,0)};
const overall=(stats.tuu/stats.tpu*100).toFixed(1);

// Meta bar
document.getElementById('pmeta').textContent=(_meta.snap||'—')+' · Δ vs '+(_meta.snap||'—')+' · '+stats.total+' orgs';

// Warn banner
if(_warn){const w=document.getElementById('warnArea');w.innerHTML='<div class="warn-banner">'+_warn+'</div>';}

// Stats boxes
const sb=document.getElementById('statsBox');
[['Overall',overall+'%'],['Total Orgs',stats.total],['Critical',stats.crit],['Warning',stats.warn],['Watch',stats.watch],['OK',stats.ok]].forEach(([l,v])=>{sb.innerHTML+='<div class="sb"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';});

function setFilter(f){
  _filter=f;
  document.querySelectorAll('.fbtn').forEach(b=>{b.classList.toggle('active',b.textContent.includes(f)||f==='ALL'&&b.textContent==='All');});
  renderTable();
}

function sortArr(k){
  if(_sortKey===k){_sortDir*=-1;}else{_sortKey=k;_sortDir=k==='n'||k==='csm'||k==='st'?1:-1;}
  document.querySelectorAll('th[data-k]').forEach(th=>{th.querySelector('.si').textContent=th.dataset.k===k?(_sortDir===1?'↑':'↓'):'↕';});
  renderTable();
}

function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let rows=[..._data];
  if(_filter!=='ALL') rows=rows.filter(o=>o.st===_filter);
  if(q) rows=rows.filter(o=>(o.n||'').toLowerCase().includes(q)||(o.csm||'').toLowerCase().includes(q));
  rows.sort((a,b)=>{
    const av=a[_sortKey],bv=b[_sortKey];
    if(typeof av==='string'&&typeof bv==='string') return _sortDir*(av||'').localeCompare(bv||'');
    return _sortDir*((av||0)-(bv||0));
  });
  const tb=document.getElementById('abdy');
  tb.innerHTML=rows.map(o=>{
    const upFmt=o.up.toFixed(1)+'%';
    const duFmt=o.du>0?'<span class="up">+'+o.du+'</span>':o.du<0?'<span class="dn">'+o.du+'</span>':o.du;
    const dutilFmt=o.dutil>0.05?'<span class="up">+'+o.dutil.toFixed(1)+'%</span>':o.dutil<-0.05?'<span class="dn">'+o.dutil.toFixed(1)+'%</span>':o.dutil.toFixed(1)+'%';
    return '<tr class="'+o.st+'" onclick="drillDown(\''+o.id+'\')">'+
      '<td>'+escH(o.n)+'</td>'+
      '<td>'+(o.csm?'<span class="csm-tag">'+escH(o.csm)+'</span>':'<span style="color:#ccc">—</span>')+'</td>'+
      '<td><span class="badge '+o.st+'">'+o.st+'</span></td>'+
      '<td><strong>'+upFmt+'</strong></td>'+
      '<td>'+o.p+'</td>'+
      '<td>'+o.u+'</td>'+
      '<td>'+duFmt+'</td>'+
      '<td>'+dutilFmt+'</td>'+
      '<td><button class="drill-btn" onclick="event.stopPropagation();drillDown(\''+o.id+'\')">View</button></td>'+
      '</tr>';
  }).join('');
  document.getElementById('rowCount').textContent='Showing '+rows.length+' of '+_data.length+' orgs';
}

function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function drillDown(id){
  const o=_data.find(x=>x.id===id);
  if(!o) return;
  document.getElementById('mTitle').textContent=o.n||id;
  const upPct=o.up.toFixed(2)+'%';
  const remaining=o.p-o.u;
  const atCapacity=o.u>=o.p*0.9?'Yes — at or near capacity':'No';
  document.getElementById('mBody').innerHTML=[
    ['CSM',o.csm||'—'],
    ['Status','<span class="badge '+o.st+'">'+o.st+'</span>'],
    ['Utilization',upPct],
    ['Returns Purchased',o.p],
    ['Returns Used',o.u],
    ['Remaining Capacity',remaining],
    ['Day-over-Day ΔUsed',(o.du>0?'+':'')+o.du],
    ['Day-over-Day ΔUtil%',(o.dutil>0?'+':'')+o.dutil.toFixed(2)+'%'],
    ['At Capacity?',atCapacity],
    ['HubSpot ID',o.id]
  ].map(([k,v])=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>').join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// Init
sortArr('up');
</script>
</body>
</html>
